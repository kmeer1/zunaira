<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Beating Heart - Zunaira</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        /* The canvas stays in the background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* The name sits on top with a glowing neon effect */
        .name-overlay {
            position: relative;
            z-index: 2;
            color: #ffffff;
            font-size: 5rem;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
            /* Creates a red/pink neon glow */
            text-shadow: 
                0 0 10px #ff0055, 
                0 0 20px #ff0055, 
                0 0 40px #ff0055, 
                0 0 80px #ff0055;
            /* Prevents the text from interfering with any mouse interactions if you add them later */
            pointer-events: none; 
            
            /* Optional: Add a subtle pulsing animation to the text to match the heart */
            animation: textPulse 1s infinite alternate;
        }

        @keyframes textPulse {
            from { transform: scale(1); opacity: 0.9; }
            to { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="name-overlay">ZUNAIRA</div>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const particleCount = 700; // Increased slightly for a denser heart
        const particles = [];

        function getHeartPoint(t) {
            return {
                x: 16 * Math.pow(Math.sin(t), 3),
                y: -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t))
            };
        }

        for (let i = 0; i < particleCount; i++) {
            const t = Math.PI * 2 * Math.random();
            const point = getHeartPoint(t);
            
            // I increased the scale slightly (from 12 to 16) so the heart wraps nicely around the text
            const scale = 16 + Math.random() * 5; 

            particles.push({
                x: width / 2,
                y: height / 2,
                targetX: width / 2 + point.x * scale,
                targetY: height / 2 + point.y * scale,
                vx: 0,
                vy: 0,
                speed: 4 + Math.random() * 3,
                friction: 0.9 + Math.random() * 0.05,
                color: `rgba(255, ${Math.floor(Math.random() * 40)}, ${70 + Math.floor(Math.random() * 60)}, ${0.3 + Math.random() * 0.5})`,
                size: 1 + Math.random() * 2,
                trace: []
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, width, height);

            const time = Date.now() * 0.003;
            const pulseFactor = Math.sin(time) * Math.cos(time * 0.5) * 0.4 + 1.0;

            particles.forEach(p => {
                const originalX = p.targetX - width / 2;
                const originalY = p.targetY - height / 2;
                
                const currentTargetX = width / 2 + originalX * pulseFactor;
                const currentTargetY = height / 2 + originalY * pulseFactor;

                const dx = currentTargetX - p.x;
                const dy = currentTargetY - p.y;
                
                p.vx += (dx / p.speed) * 0.1;
                p.vy += (dy / p.speed) * 0.1;

                p.vx *= p.friction;
                p.vy *= p.friction;

                p.vx += (Math.random() - 0.5) * 0.5;
                p.vy += (Math.random() - 0.5) * 0.5;

                p.x += p.vx;
                p.y += p.vy;

                p.trace.push({ x: p.x, y: p.y });
                if (p.trace.length > 4) p.trace.shift();

                ctx.beginPath();
                if (p.trace.length > 1) {
                    ctx.moveTo(p.trace[0].x, p.trace[0].y);
                    for (let j = 1; j < p.trace.length; j++) {
                        ctx.lineTo(p.trace[j].x, p.trace[j].y);
                    }
                } else {
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                }
                ctx.strokeStyle = p.color;
                ctx.lineWidth = p.size;
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            const oldWidth = width;
            const oldHeight = height;
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            particles.forEach(p => {
                p.targetX = width / 2 + (p.targetX - oldWidth / 2);
                p.targetY = height / 2 + (p.targetY - oldHeight / 2);
            });
        });

        animate();
    </script>
</body>
</html>
