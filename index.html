<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfort & Patience</title>
    <style>
        /* Implements the soft, elegant aesthetic from your image */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ECC6FF; /* The exact dusty rose/mauve background color */
            font-family: 'Georgia', 'Times New Roman', serif; /* Elegant, classic font like the image */
            color: #ffffff;
            text-align: center;
            overflow-x: hidden;
        }

        /* Subtle background gradient to add depth */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.15) 100%);
            z-index: 1;
        }

        /* Main content container */
        .container {
            position: relative;
            z-index: 2;
            max-width: 550px;
            padding: 40px 25px;
            box-sizing: border-box;
            animation: fadeInPage 2.5s ease-out forwards;
        }

        /* The Arabic Calligraphy Style Header */
        .arabic-header {
            font-size: 4.5rem;
            margin-bottom: 2rem;
            font-weight: normal;
            letter-spacing: 2px;
            /* Creates the soft, elegant white glow from the image */
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8), 
                0 0 20px rgba(255, 255, 255, 0.5), 
                0 0 30px rgba(255, 255, 255, 0.3);
            user-select: none;
        }

        /* The quote text styling matching the typography in the image */
        .quote-text {
            font-size: 1.45rem;
            line-height: 1.8;
            font-weight: 300;
            letter-spacing: 0.5px;
            opacity: 0.95;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.15);
            transition: opacity 0.5s ease;
        }

        /* Soft fade-in animation when loading the page */
        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile responsiveness adjustments */
        @media (max-width: 600px) {
            .arabic-header { font-size: 3.5rem; margin-bottom: 1.5rem; }
            .quote-text { font-size: 1.2rem; line-height: 1.7; max-width: 90%; margin: 0 auto; }
        }
    </style>
</head>

        // Unique daily math selector based on calendar date
